<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Listen to your favorite Irish radio stations live online. Discover, play and enjoy a curated selection of streaming stations from Ireland with a simple and ad-free interface.">
    <meta name="keywords" content="Ireland, radio, stations, live, streaming, online, listen, music, news, talk">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <title>Ireland's Radio Stations</title>
  </head>

  <body>

    <section class="banner">
      <img src="images/Mobile-banner.avif" alt="Mobile hero image for Ireland's Radio Stations">
      <div class="container">
        <div class="content">
          <p class="text">LISTEN TO IRISH RADIO ANYWHERE</p>
          <h1>Ireland's<br><span>Radio Stations</span></h1>
          <p class="subtitle">Your one stop shop to Irish radio stations.<br>News, music, talk, sport and more.</p>
          <div class="search-holder-container">
            <div class="search-holder">
              <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
              </svg>
              <input type="text" id="search-box" placeholder="Search for a station..." autocomplete="off">
              <svg xmlns="http://www.w3.org/2000/svg" class="clear-search" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
              </svg>
              <div id="search-box-suggestions"></div>
            </div>
          </div>
        </div>
        <div class="hero-tagline">Irish Radio<br>Always On</div>
      </div>
    </section>

    <div class="container-fluid">
      <div class="stations" id="station-list"></div>
    </div>

    <a href="#" class="arrow-up">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-up" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5"/>
      </svg>
      <span>Back to top</span>
    </a>

    <footer>
      <p>Developed by <a href="https://josefzacek.com/" target="_blank" title="Visit josefzacek.com" rel="noopener noreferrer">josefzacek.com</a></p>
    </footer>

    <div id="now-playing-bar" class="now-playing-bar">
      <div class="npb-left">
        <div class="npb-logo" id="npb-logo"></div>
        <div class="npb-info">
          <p class="npb-name" id="npb-name"></p>
          <p class="npb-subtitle">Live Radio</p>
        </div>
      </div>
      <div class="npb-center">
        <button class="npb-btn" id="npb-prev" aria-label="Previous station">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M.5 3.5A.5.5 0 0 1 1 4v3.248l6.267-3.636c.54-.313 1.232.066 1.232.696v2.94l6.267-3.636c.54-.314 1.232.066 1.232.696v7.384c0 .63-.692 1.01-1.232.697L8.5 8.753v2.94c0 .63-.692 1.01-1.232.697L1 8.753V12a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5"/>
          </svg>
        </button>
        <button class="npb-btn npb-play-pause" id="npb-play-pause" aria-label="Pause">
          <svg class="npb-pause-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"/>
          </svg>
          <svg class="npb-play-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" style="display:none">
            <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
          </svg>
        </button>
        <button class="npb-btn" id="npb-next" aria-label="Next station">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M15.5 3.5a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V8.753l-6.267 3.636c-.54.313-1.233-.066-1.233-.697v-2.94l-6.267 3.636C.693 12.703 0 12.322 0 11.693V4.308c0-.63.693-1.01 1.233-.696L7.5 7.248v-2.94c0-.63.693-1.01 1.233-.696L15 7.248V4a.5.5 0 0 1 .5-.5"/>
          </svg>
        </button>
      </div>
      <div class="npb-right">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="npb-vol-icon" viewBox="0 0 16 16">
          <path d="M11.536 14.01A8.473 8.473 0 0 0 14.026 8a8.473 8.473 0 0 0-2.49-6.01l-.708.707A7.476 7.476 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
          <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.483 5.483 0 0 1 11.025 8a5.483 5.483 0 0 1-1.61 3.89z"/>
          <path d="M8.707 11.182A4.486 4.486 0 0 0 10.025 8a4.486 4.486 0 0 0-1.318-3.182L8 5.525A3.489 3.489 0 0 1 9.025 8 3.49 3.49 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06z"/>
        </svg>
        <input type="range" id="npb-volume" class="npb-volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.0.15/howler.core.min.js"></script>
    <script src="script.js"></script>
  </body>

</html>
